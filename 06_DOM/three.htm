<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dom</title>
</head>
<body style="background-color: #212121; color: #fff;">
    
</body>
<script>
    const div=(document.createElement('div'));//div element create krne ke liye createElement method use krte h
    console.log(div);
    div.className='box';//div element ko class dene ke liye className property use krte h
    div.id=Math.round(Math.random())*10+1;//div element ko id dene ke liye id property use krte h
    div.setAttribute('title','This is a div element');//div element ko title attribute dene ke liye setAttribute method use krte h
    //div.style.width='100px';//div element ka width set krne ke liye style property use krte h
    //div.style.height='100px';//div element ka height set krne ke liye style property use krte h
    div.style.backgroundColor='green';//div element ka background color set krne ke liye style property use krte h
    const addText=document.createTextNode("Hello World");//div element ke andar text add krne ke liye createTextNode method use krte h
    div.appendChild(addText);//text node ko div element ke andar append krne ke liye appendChild method use krte h

    document.body.appendChild(div);//div element ko body ke andar append krne ke liye appendChild method use krte h
</script>
</html>
