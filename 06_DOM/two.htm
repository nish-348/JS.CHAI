<!DOCTYPE html>
<html lang="en">                
<head>
    <meta charset="UTF-8">
    <title>Dom</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <div class="parent">
<div class="day"> monday</div>
<div class="day"> tuesday</div>
<div class="day"> wednesday</div>
<div class="day"> thursday</div>
<div class="day"> friday</div>
    </div>
</body>
<script>
    const parent = document.querySelector('.parent');//parent ek class h toh usko select krne ke liye queryselector use kr rhe h
    console.log(parent);
    console.log(parent.children) //HTML collection return krta h
    console.log(parent.childNodes) //NodeList return krta h
    console.log(parent.childNodes[0]) //first child node
    console.log(parent.childNodes[1]) //second child node

    for(let i=0; i<parent.childNodes.length; i++){
        console.log(parent.childNodes[i]);//yeh loop ke through hum child nodes ko access kr rhe h


    }
    parent.children[0].style.color = 'red'; //first child element ka color red kr diya
    console.log(parent.firstElementChild); //first child element ko access krne ke liye firstElementChild use krte h
    console.log(parent.lastElementChild); //last child element ko access krne ke liye
    </script>
</html>
